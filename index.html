<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>마음잇다 — 엄마가 전화 안 받아도 안 불안해</title>
  <meta name="description" content="평소와 다를 때만 알려주니까. 카메라 없이 엄마 폰 그대로.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 화면 1: 첫 화면 -->
  <main class="screen" id="screen-home">
    <p class="brand">마음잇다</p>
    <h1>엄마가 전화 안 받아도<br>안 불안해</h1>
    <p class="sub">평소와 다를 때만 알려주니까.<br>카메라 없이 엄마 폰 그대로</p>
    <ul class="empathy">
      <li>엄마 카톡 '1'이 3시간째 안 사라지죠?</li>
      <li>결산 날, 엄마 부재중 한 통에 일이 손에 안 잡히죠?</li>
      <li>엄마 '괜찮다'가 제일 안 믿기죠?</li>
    </ul>
    <button class="btn" type="button" data-go="screen-input">엄마 평소와 비교해 보기</button>
    <p class="trust">통화·문자 내용은 모으지 않아요 · 비의료 보조 도구</p>
  </main>

  <!-- 화면 2: 준비 중 (첫 배포용) -->
  <main class="screen center" id="screen-input" hidden>
    <h2>준비 중</h2>
    <button class="btn secondary" type="button" data-go="screen-home">처음으로</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
